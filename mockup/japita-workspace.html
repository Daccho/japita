<div id="japita-lookbook">

        }
        function linksPage() {
          return '<section class="jp-panel"><div class="jp-line-head"><h2>Restaurant links</h2></div><p class="jp-section-note">Keep your public pages together. Add the restaurant’s actual URLs; links do not import reviews or ratings.</p>'+['Owned channels','Discovery and reservations'].map(function(group){return '<div class="jp-link-group"><h3>'+group+'</h3>'+linkTypes.filter(function(item){return item.group===group;}).map(function(item){const url=s.links[item.id];const editing=s.linkEditing===item.id;return '<div class="jp-link-row '+(editing?'jp-link-edit':'')+'">'+icon(item.icon)+'<div><h3>'+item.name+'</h3><p>'+(url?escapeHtml(url):'Not added')+'</p></div>'+button(url?'Edit link':icon('plus')+'Add link','editLink:'+item.id,false)+(editing?'<form class="jp-link-editor" data-link-form="'+item.id+'"><label class="jp-field">Page URL<input type="url" name="url" value="'+escapeHtml(url||'')+'" maxlength="400" placeholder="'+item.placeholder+'" required aria-label="'+item.name+' URL"></label>'+(s.linkError?'<p class="jp-error" role="alert">'+s.linkError+'</p>':'')+'<div class="jp-form-actions"><button type="submit" class="jp-action jp-primary cursor-interaction">Save link</button>'+button('Cancel','cancelLink',false)+(url?button('Remove','removeLink:'+item.id,false):'')+'</div></form>':'')+'</div>';}).join('')+'</div>';}).join('')+'<p class="jp-muted" style="font-size:12px;margin-top:20px">Kumo is fictional, so no public listings are prefilled.</p></section>';
        }
        function goals() {
          const tabs=[['overview','Overview'],['menu','Menu'],['buying','Buying preferences'],['links','Links']];
          return '<div class="jp-header"><div><span class="jp-kicker">Kumo Ramen Milano</span><h1 style="margin-top:8px">Restaurant profile</h1><p class="jp-muted">Your restaurant, menu and purchasing preferences.</p></div></div><nav class="jp-profile-tabs" aria-label="Restaurant profile sections">'+tabs.map(function(tab){return '<button type="button" class="cursor-interaction" data-act="profileTab:'+tab[0]+'" aria-pressed="'+(s.profileTab===tab[0])+'" aria-controls="'+id+'-profile-content">'+tab[1]+'</button>';}).join('')+'</nav><div id="'+id+'-profile-content" aria-label="'+tabs.find(function(tab){return tab[0]===s.profileTab;})[1]+'">'+(s.profileTab==='overview'?overview():s.profileTab==='menu'?menuPage():s.profileTab==='buying'?buyingPreferences():linksPage())+'</div>';
        }
        function render() {
          app.querySelectorAll('[data-page]').forEach(function(n){if(n.dataset.page===s.page)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');});
          app.querySelectorAll('[data-basket-count]').forEach(function(n){n.textContent=s.selected?'3':'2';});
          content.innerHTML=(s.page==='week'?week():s.page==='suppliers'?suppliers():s.page==='basket'?basket():goals())+(s.toast?'<div class="jp-toast" role="status">'+s.toast+'</div>':'')+footer();
          mountNotifications();
          const input=content.querySelector('[data-search]'); if(input)input.value=s.query;
          if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
        }
        app.addEventListener('click',function(e){
          const nav=e.target.closest('[data-page]');
          if(nav){s.page=nav.dataset.page;s.notificationsOpen=false;s.menuDraft=null;s.menuError='';s.toast='';render();persist();return;}
          const trigger=e.target.closest('[data-act]'); if(!trigger||trigger.disabled)return;
          const action=trigger.dataset.act; s.toast='';
          if(action==='notifications'){s.notificationsOpen=!s.notificationsOpen;if(s.notificationsOpen)s.notificationsRead=true;render();persist();return;}
          if(action==='closeNotifications'){s.notificationsOpen=false;render();const bell=content.querySelector('.jp-notification-bell');if(bell)bell.focus();return;}
          s.notificationsOpen=false;
          if(['week','basket','goals'].includes(action))s.page=action;
          else if(action.startsWith('profileTab:')){s.profileTab=action.split(':')[1];s.profileEditing=false;s.menuDraft=null;s.menuError='';s.linkEditing=null;s.linkError='';}
          else if(action==='editProfile')s.profileEditing=true;
          else if(action==='cancelProfile')s.profileEditing=false;
          else if(action==='editMenu'){s.menuDraft=readMenu(s.menu);s.menuError='';}
          else if(action==='cancelMenu'){s.menuDraft=null;s.menuError='';}
          else if(action.startsWith('menuDetail:')){const key=action.split(':')[1];s.menuExpanded=s.menuExpanded===key?null:key;}
          else if(action.startsWith('editLink:')){s.linkEditing=action.split(':')[1];s.linkError='';}
          else if(action==='cancelLink'){s.linkEditing=null;s.linkError='';}
          else if(action.startsWith('removeLink:')){delete s.links[action.split(':')[1]];s.linkEditing=null;s.toast='Link removed from the demo workspace.';}
          else if(action==='compare'){s.page='suppliers';s.filter='all';s.query='';}
          else if(action==='discover'){s.page='suppliers';s.filter='discover';s.query='';}
          else if(action==='all')s.filter='all';
          else if(action==='quality'||action==='cost')s.priority=action;
          else if(action.startsWith('add:')){s.selected=action.split(':')[1];s.orderReviewed=false;s.toast='Noodle selection updated. Your draft basket is '+money(total())+'.';}
          else if(action.startsWith('detail:'))s.detail=s.detail===action.split(':')[1]?null:action.split(':')[1];
          else if(action==='quote'){s.quoteDraft=!s.quoteDraft;s.detail='quote';}
          else if(action==='exampleReply'){s.quoteDraft=false;s.quoteReceived=true;s.toast='Example reply loaded: €345 delivered. Product sample approval is still pending.';}
          else if(action==='review'){s.orderReviewed=true;s.toast='Draft reviewed in this concept. No purchase order has been sent.';}
          render();persist();
          if(action==='editProfile'){const field=content.querySelector('[name="description"]');if(field)field.focus();}
          if(action==='editMenu'){const field=content.querySelector('[data-menu-field="name"]');if(field)field.focus();}
          if(action==='cancelMenu'){const edit=content.querySelector('[data-act="editMenu"]');if(edit)edit.focus();}
          if(action.startsWith('menuDetail:')){const expand=content.querySelector('[data-act="'+action+'"]');if(expand)expand.focus();}
          if(action.startsWith('editLink:')){const field=content.querySelector('[data-link-form] input');if(field)field.focus();}
        });
        app.addEventListener('submit',function(e){
          if(e.target.matches('[data-menu-form]')){
            e.preventDefault();
            if(!s.menuDraft||!e.target.reportValidity())return;
            if(s.menuDraft.some(function(item){return !item.name.trim();})){s.menuError='Enter a name for every menu item.';render();return;}
            const refills=s.menuDraft.find(function(item){return item.id==='kaedama';});
            const sets=s.menuDraft.find(function(item){return item.id==='tonkotsu_set';});
            if(refills.servings<sets.servings){s.menuError='Kaedama includes one refill per Tonkotsu set. Enter at least '+sets.servings+' refills.';render();return;}
            s.menu=readMenu(s.menuDraft);s.menuDraft=null;s.menuError='';s.toast='Menu saved in this demo workspace.';render();persist();
            const edit=content.querySelector('[data-act="editMenu"]');if(edit)edit.focus();
          }else if(e.target.matches('[data-profile-form]')){
            e.preventDefault();
            const form=new FormData(e.target);
            const values={};
            Object.keys(profileDefaults).forEach(function(key){values[key]=key==='storage'?s.profile.storage:String(form.get(key)||'').trim();});
            s.profile=readProfile(values);s.profileEditing=false;s.toast='Restaurant profile saved in this demo workspace.';render();persist();
          }else if(e.target.matches('[data-link-form]')){
            e.preventDefault();
            const key=e.target.dataset.linkForm;
            const url=String(new FormData(e.target).get('url')||'').trim();
            const accepted=readLinks({[key]:url});
            if(!accepted[key]){s.linkError='Enter a full http:// or https:// URL without account credentials.';render();return;}
            s.links[key]=accepted[key];s.linkEditing=null;s.linkError='';s.toast='Restaurant link saved in this demo workspace.';render();persist();
          }
        });
        app.addEventListener('change',function(e){if(e.target.matches('[data-frozen]')){s.frozenAllowed=e.target.checked;if(!s.frozenAllowed&&s.selected==='frozen'){s.selected=null;s.orderReviewed=false;s.toast='Frozen noodles removed because your requirement changed.';}render();persist();}else if(e.target.matches('[data-priority]')){s.priority=e.target.value;render();persist();}else if(e.target.matches('[data-supplier-country]')){s.preferredCountry=e.target.value;render();persist();}else if(e.target.matches('[data-budget]')){const budget=Number(e.target.value);if(e.target.validity.valid&&budget>0&&budget<=100000){s.budget=budget;render();persist();}}else if(e.target.matches('[data-storage]')){s.profile.storage=e.target.value.slice(0,160);persist();}});
        app.addEventListener('input',function(e){
          if(e.target.matches('[data-menu-field]')&&s.menuDraft){
            const item=s.menuDraft.find(function(row){return row.id===e.target.dataset.menuId;});
            const key=e.target.dataset.menuField;
            if(item)item[key]=key==='ingredients'?e.target.value.split(',').map(function(ingredient){return ingredient.trim();}).filter(Boolean):['price','servings'].includes(key)?(e.target.value===''?null:Number(e.target.value)):e.target.value;
            return;
          }
          if(!e.target.matches('[data-search]'))return;s.query=e.target.value;const list=content.querySelector('[data-offer-list]');const shown=offers.filter(function(o){return(s.filter!=='discover'||o.id!=='fresh')&&((o.name+' '+o.product+' '+o.format+' '+o.supplierCountry+' '+o.productOrigin+' '+o.dispatchCountry).toLowerCase().includes(s.query.toLowerCase()));});list.innerHTML=shown.length?shown.map(offerCard).join(''):'<div class="jp-panel">No matching offers in this sample catalog.</div>';if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
        });
        app.addEventListener('keydown',function(e){if(e.key==='Escape'&&s.notificationsOpen){s.notificationsOpen=false;render();const bell=content.querySelector('.jp-notification-bell');if(bell)bell.focus();}});
        const controller={id:id,snapshot:function(){return{profileVersion:1,page:s.page,profileTab:s.profileTab,profile:s.profile,menu:s.menu,links:s.links,budget:s.budget,priority:s.priority,selected:s.selected,filter:s.filter,detail:s.detail,quoteReceived:s.quoteReceived,frozenAllowed:s.frozenAllowed,orderReviewed:s.orderReviewed,preferredCountry:s.preferredCountry,notificationsRead:s.notificationsRead};},restore:function(v){if(!v)return;['priority','selected','filter','detail','quoteReceived','frozenAllowed','orderReviewed','preferredCountry','notificationsRead'].forEach(function(k){if(v[k]!==undefined)s[k]=v[k];});if(v.profileVersion===1){if(['week','suppliers','basket','goals'].includes(v.page))s.page=v.page;if(['overview','menu','buying','links'].includes(v.profileTab))s.profileTab=v.profileTab;s.profile=readProfile(v.profile);s.menu=readMenu(v.menu);s.links=readLinks(v.links);if(Number.isFinite(v.budget)&&v.budget>0&&v.budget<=100000)s.budget=v.budget;}render();}};
        controllers.push(controller);render();
        if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:app,onChange:function(){app.style.setProperty('--jp-radius',s.appearance.radius+'px');app.classList.toggle('jp-compact',s.appearance.density==='Compact');}});tweak.addSlider(s.appearance,'radius',{label:'Corner radius',min:4,max:24,unit:'px'});tweak.addSelect(s.appearance,'density',{label:'Content spacing',options:['Comfortable','Compact']});}
      }
      mount('jp-workspace',false);mount('jp-guided',true);
      window.addEventListener('openai:set_globals',function(e){const ws=e.detail&&e.detail.globals&&e.detail.globals.widgetState;const p=ws&&ws.privateContent;if(p)controllers.forEach(function(c){c.restore(p[c.id]);});});
    })();
  </script>
</div>
