<div id="japita-lookbook">

          if(['offers','basket','goals'].includes(action))s.page=action;
          else if(action==='supplierDirectory'){s.page='suppliers';s.supplierMode='directory';}
          else if(action.startsWith('promotion:')){const key=action.split(':')[1];s.promotionDetail=s.promotionDetail===key?null:key;}
          else if(action.startsWith('promotionSupplier:')){const key=action.split(':')[1],supplier=supplierDirectory.find(function(item){return item.id===key;});s.page='suppliers';s.supplierMode='directory';s.supplierDetail=key;s.directoryFiltersOpen=false;if(supplier.relationship==='existing'){s.directoryRelationship='existing';s.directoryFilters=readDirectoryFilters({supplier:key});}else{s.directoryRelationship='discover';s.discoveryFilters=readDirectoryFilters();s.directoryQuery=supplier.name;s.directoryDraft=s.directoryQuery;s.directoryHasSearched=true;}}
          else if(action.startsWith('supplier:')){const key=action.split(':')[1];s.supplierDetail=s.supplierDetail===key?null:key;}
          else if(action.startsWith('directoryFilter:')){s.directoryRelationship=action.split(':')[1]==='discover'?'discover':'existing';s.supplierDetail=null;s.directoryFiltersOpen=false;}
          else if(action==='toggleDirectoryFilters')s.directoryFiltersOpen=!s.directoryFiltersOpen;
          else if(action==='resetDirectoryFilters'){if(s.directoryRelationship==='discover')s.discoveryFilters=readDirectoryFilters();else s.directoryFilters=readDirectoryFilters();s.supplierDetail=null;}
          else if(action==='clearDirectorySearch'){s.directoryQuery='';s.directoryDraft='';s.directoryHasSearched=false;s.supplierDetail=null;}
          else if(action.startsWith('profileTab:')){s.profileTab=action.split(':')[1];s.profileEditing=false;s.menuDraft=null;s.menuError='';s.linkEditing=null;s.linkError='';}
          else if(action==='editProfile')s.profileEditing=true;
          else if(action==='cancelProfile')s.profileEditing=false;
          else if(action==='editMenu'){s.menuDraft=readMenu(s.menu);s.menuError='';}
          else if(action==='cancelMenu'){s.menuDraft=null;s.menuError='';}
          else if(action.startsWith('editLink:')){s.linkEditing=action.split(':')[1];s.linkError='';}
          else if(action==='cancelLink'){s.linkEditing=null;s.linkError='';}
          else if(action.startsWith('removeLink:')){delete s.links[action.split(':')[1]];s.linkEditing=null;s.toast='Link removed from the demo workspace.';}
          else if(action==='compare'){s.page='suppliers';s.supplierMode='compare';s.filter='all';s.query='';}
          else if(action==='discover'){s.page='suppliers';s.supplierMode='directory';s.directoryRelationship='discover';s.directoryQuery='';s.directoryDraft='';s.directoryHasSearched=false;s.directoryFiltersOpen=false;}
          else if(action==='newQuotes')s.filter='discover';
          else if(action==='all')s.filter='all';
          else if(action==='quality'||action==='cost')s.priority=action;
          else if(action.startsWith('add:')){s.selected=action.split(':')[1];s.orderReviewed=false;s.toast='Noodle selection updated. Your draft basket is '+money(total())+'.';}
          else if(action.startsWith('detail:'))s.detail=s.detail===action.split(':')[1]?null:action.split(':')[1];
          else if(action==='quote'){s.quoteDraft=!s.quoteDraft;s.detail='quote';}
          else if(action==='exampleReply'){s.quoteDraft=false;s.quoteReceived=true;s.toast='Example reply loaded: €345 delivered. Product sample approval is still pending.';}
          else if(action==='review'){s.orderReviewed=true;s.toast='Draft reviewed in this concept. No purchase order has been sent.';}
          render();persist();
          if(action==='editProfile'){const field=content.querySelector('[name="description"]');if(field)field.focus();}
          if(action==='editMenu'){const field=content.querySelector('[data-menu-field="name"]');if(field)field.focus();}
          if(action==='cancelMenu'){const edit=content.querySelector('[data-act="editMenu"]');if(edit)edit.focus();}
          if(action.startsWith('editLink:')){const field=content.querySelector('[data-link-form] input');if(field)field.focus();}
          if(action.startsWith('supplier:')||action.startsWith('directoryFilter:')){const focus=content.querySelector('[data-act="'+action+'"]');if(focus)focus.focus();}
          if(action==='toggleDirectoryFilters'){const focus=content.querySelector(s.directoryFiltersOpen?'[data-directory-filter]':'[data-act="toggleDirectoryFilters"]');if(focus)focus.focus();}
          if(action==='resetDirectoryFilters'){const focus=content.querySelector('[data-act="resetDirectoryFilters"]');if(focus)focus.focus();}
          if(action==='clearDirectorySearch'){const focus=content.querySelector('[data-directory-query]');if(focus)focus.focus();}
          if(action.startsWith('promotion:')){const focus=content.querySelector('[data-act="'+action+'"]');if(focus)focus.focus();}
        });
        app.addEventListener('submit',function(e){
          if(e.target.matches('[data-directory-form]')){
            e.preventDefault();const query=s.directoryDraft.trim();if(!query){const field=e.target.querySelector('[data-directory-query]');field.setCustomValidity('Describe a supplier or product to start your search.');field.reportValidity();return;}s.directoryQuery=query;s.directoryHasSearched=true;s.supplierDetail=null;render();persist();const input=content.querySelector('[data-directory-query]');if(input)input.focus();
          }else if(e.target.matches('[data-menu-form]')){
            e.preventDefault();
            if(!s.menuDraft||!e.target.reportValidity())return;
            const unnamed=s.menuDraft.find(function(item){return !item.name.trim();});
            if(unnamed){s.menuError='Enter a name for every menu item.';render();openMenuField(content.querySelector('[data-menu-id="'+unnamed.id+'"][data-menu-field="name"]'));return;}
            const refills=s.menuDraft.find(function(item){return item.id==='kaedama';});
            const sets=s.menuDraft.find(function(item){return item.id==='tonkotsu_set';});
            if(refills.servings<sets.servings){s.menuError='Kaedama includes one refill per Tonkotsu set. Enter at least '+sets.servings+' refills.';render();openMenuField(content.querySelector('[data-menu-id="kaedama"][data-menu-field="servings"]'));return;}
            s.menu=readMenu(s.menuDraft);s.menuDraft=null;s.menuError='';s.toast='Menu saved in this demo workspace.';render();persist();
            const edit=content.querySelector('[data-act="editMenu"]');if(edit)edit.focus();
          }else if(e.target.matches('[data-profile-form]')){
            e.preventDefault();
            const form=new FormData(e.target);
            const values={};
            Object.keys(profileDefaults).forEach(function(key){values[key]=key==='storage'?s.profile.storage:String(form.get(key)||'').trim();});
            s.profile=readProfile(values);s.profileEditing=false;s.toast='Restaurant profile saved in this demo workspace.';render();persist();
          }else if(e.target.matches('[data-link-form]')){
            e.preventDefault();
            const key=e.target.dataset.linkForm;
            const url=String(new FormData(e.target).get('url')||'').trim();
            const accepted=readLinks({[key]:url});
            if(!accepted[key]){s.linkError='Enter a full http:// or https:// URL without account credentials.';render();return;}
            s.links[key]=accepted[key];s.linkEditing=null;s.linkError='';s.toast='Restaurant link saved in this demo workspace.';render();persist();
          }
        });
        app.addEventListener('invalid',function(e){
          if(e.target.matches('[data-menu-field]'))openMenuField(e.target);
        },true);
        app.addEventListener('toggle',function(e){
          if(e.target.matches('[data-menu-details]')&&e.target.open)e.target.querySelectorAll('[data-menu-autosize]').forEach(resizeMenuField);
        },true);
        app.addEventListener('change',function(e){
          const country=e.target.matches('[data-directory-country]');
          if(!country&&!e.target.matches('[data-directory-filter]'))return;
          const key=country?'country':e.target.dataset.directoryFilter;
          const value=country?directoryCountry(e.target.value):e.target.value;
          if(country&&value===null){e.target.setCustomValidity('Choose a country from the list.');e.target.reportValidity();return;}
          const filters=s.directoryRelationship==='discover'?s.discoveryFilters:s.directoryFilters;
          filters[key]=value;
          s.supplierDetail=null;render();persist();const focus=content.querySelector(country?'[data-directory-country]':'[data-directory-filter="'+key+'"]');if(focus)focus.focus();
        });
        app.addEventListener('change',function(e){if(e.target.matches('[data-frozen]')){s.frozenAllowed=e.target.checked;if(!s.frozenAllowed&&s.selected==='frozen'){s.selected=null;s.orderReviewed=false;s.toast='Frozen noodles removed because your requirement changed.';}render();persist();}else if(e.target.matches('[data-priority]')){s.priority=e.target.value;render();persist();}else if(e.target.matches('[data-supplier-country]')){s.preferredCountry=e.target.value;render();persist();}else if(e.target.matches('[data-budget]')){const budget=Number(e.target.value);if(e.target.validity.valid&&budget>0&&budget<=100000){s.budget=budget;render();persist();}}else if(e.target.matches('[data-storage]')){s.profile.storage=e.target.value.slice(0,160);persist();}});
        app.addEventListener('input',function(e){
          if(e.target.matches('[data-directory-query]')){s.directoryDraft=e.target.value.slice(0,240);e.target.setCustomValidity('');return;}
          if(e.target.matches('[data-directory-country]')){e.target.setCustomValidity('');return;}
          if(e.target.matches('[data-menu-field]')&&s.menuDraft){
            const item=s.menuDraft.find(function(row){return row.id===e.target.dataset.menuId;});
            const key=e.target.dataset.menuField;
            if(item)item[key]=key==='ingredients'?e.target.value.split(',').map(function(ingredient){return ingredient.trim();}).filter(Boolean):['price','servings'].includes(key)?(e.target.value===''?null:Number(e.target.value)):e.target.value;
            resizeMenuField(e.target);
            if(item&&key==='servings'){
              const sets=s.menuDraft.find(function(row){return row.id==='tonkotsu_set';}).servings||0;
              const refills=s.menuDraft.find(function(row){return row.id==='kaedama';}).servings||0;
              const summary=content.querySelector('[data-menu-summary="'+item.id+'"]');
              if(summary)summary.textContent=item.servings===null?'Plan not entered':item.servings.toLocaleString('en-IE')+' planned '+(item.id==='kaedama'?'refills':'servings');
              const totals=content.querySelector('[data-menu-totals]');
              if(totals)totals.textContent=plannedBowls(s.menuDraft).toLocaleString('en-IE')+' planned bowls · '+refills.toLocaleString('en-IE')+' refills, including set refills.';
              const breakdown=content.querySelector('[data-menu-refills]');
              if(breakdown)breakdown.textContent=sets.toLocaleString('en-IE')+' included with sets · '+Math.max(0,refills-sets).toLocaleString('en-IE')+' additional refills.';
            }
            return;
          }
          if(!e.target.matches('[data-search]'))return;s.query=e.target.value;const list=content.querySelector('[data-offer-list]');const shown=offers.filter(function(o){return(s.filter!=='discover'||o.id!=='fresh')&&((o.name+' '+o.product+' '+o.format+' '+o.supplierCountry+' '+o.productOrigin+' '+o.dispatchCountry).toLowerCase().includes(s.query.toLowerCase()));});list.innerHTML=shown.length?shown.map(offerCard).join(''):'<div class="jp-panel">No matching offers in this sample catalog.</div>';if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});
        });
        app.addEventListener('keydown',function(e){
          if(e.target.matches('[data-directory-query]')&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.closest('form').requestSubmit();return;}
          if(s.menuDraft&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
            e.preventDefault();content.querySelector('[data-menu-form]').requestSubmit();return;
          }
          if(e.key!=='Escape')return;
          if(s.notificationsOpen){s.notificationsOpen=false;render();const bell=content.querySelector('.jp-notification-bell');if(bell)bell.focus();}
          else if(s.advisorOpen){s.advisorOpen=false;renderAdvisor();if(globalThis.lucide)globalThis.lucide.createIcons({attrs:{width:16,height:16}});const launcher=advisorDock.querySelector('.jp-advisor-launcher');if(launcher)launcher.focus();}
          else if(s.directoryFiltersOpen){s.directoryFiltersOpen=false;render();const trigger=content.querySelector('[data-act="toggleDirectoryFilters"]');if(trigger)trigger.focus();}
        });
        app.addEventListener('pointerdown',function(e){
          const launcher=e.target.closest('.jp-advisor-launcher');
          if(!launcher||e.button!==0)return;
          suppressAdvisorClick=false;
          const rect=advisorDock.getBoundingClientRect();
          advisorDrag={pointer:e.pointerId,x:e.clientX,y:e.clientY,left:rect.left,top:rect.top,moved:false,launcher:launcher};
          launcher.setPointerCapture(e.pointerId);
        });
        app.addEventListener('pointermove',function(e){
          if(!advisorDrag||advisorDrag.pointer!==e.pointerId)return;
          const dx=e.clientX-advisorDrag.x,dy=e.clientY-advisorDrag.y;
          if(!advisorDrag.moved&&Math.hypot(dx,dy)<5)return;
          advisorDrag.moved=true;e.preventDefault();
          const width=Math.max(1,window.innerWidth-88),height=Math.max(1,window.innerHeight-88);
          s.advisorPosition={x:Math.max(0,Math.min(1,(advisorDrag.left+dx-16)/width)),y:Math.max(0,Math.min(1,(advisorDrag.top+dy-16)/height))};
          positionAdvisor();
        });
        function finishAdvisorDrag(e) {
          if(!advisorDrag||advisorDrag.pointer!==e.pointerId)return;
          suppressAdvisorClick=advisorDrag.moved;
          if(advisorDrag.launcher.hasPointerCapture(e.pointerId))advisorDrag.launcher.releasePointerCapture(e.pointerId);
          advisorDrag=null;
          if(suppressAdvisorClick)persist();
        }
        app.addEventListener('pointerup',finishAdvisorDrag);
        app.addEventListener('pointercancel',finishAdvisorDrag);
        window.addEventListener('resize',positionAdvisor);
        window.addEventListener('resize',function(){content.querySelectorAll('[data-menu-autosize]').forEach(resizeMenuField);});
        if(document.fonts)document.fonts.ready.then(function(){content.querySelectorAll('[data-menu-autosize]').forEach(resizeMenuField);});
        const controller={id:id,snapshot:function(){return {
          workspaceVersion:2,profileVersion:1,page:s.page,profileTab:s.profileTab,profile:s.profile,menu:s.menu,links:s.links,budget:s.budget,priority:s.priority,selected:s.selected,filter:s.filter,detail:s.detail,quoteReceived:s.quoteReceived,frozenAllowed:s.frozenAllowed,orderReviewed:s.orderReviewed,preferredCountry:s.preferredCountry,notificationsRead:s.notificationsRead,
          directoryVersion:1,directoryQuery:s.directoryQuery,directoryDraft:s.directoryDraft,directoryHasSearched:s.directoryHasSearched,directoryFilters:s.directoryFilters,discoveryFilters:s.discoveryFilters,directoryRelationship:s.directoryRelationship,advisorPosition:s.advisorPosition
        };},restore:function(v){
          if(!v)return;
          ['priority','selected','filter','detail','quoteReceived','frozenAllowed','orderReviewed','preferredCountry','notificationsRead'].forEach(function(k){if(v[k]!==undefined)s[k]=v[k];});
          if(v.profileVersion===1){
            s.page=v.workspaceVersion===2&&['suppliers','offers','basket','goals'].includes(v.page)?v.page:'suppliers';
            if(['overview','menu','buying','links'].includes(v.profileTab))s.profileTab=v.profileTab;
            s.profile=readProfile(v.profile);s.menu=readMenu(v.menu);s.links=readLinks(v.links);
            if(Number.isFinite(v.budget)&&v.budget>0&&v.budget<=100000)s.budget=v.budget;
            if(typeof v.directoryQuery==='string')s.directoryQuery=v.directoryQuery.slice(0,240);
            s.directoryDraft=typeof v.directoryDraft==='string'?v.directoryDraft.slice(0,240):s.directoryQuery;
            s.directoryFilters=readDirectoryFilters(v.directoryFilters);s.discoveryFilters=readDirectoryFilters(v.discoveryFilters);
            s.directoryRelationship=v.directoryRelationship==='discover'?'discover':'existing';
            s.directoryHasSearched=!!(s.directoryQuery.trim()&&(v.directoryVersion===1?v.directoryHasSearched:v.directoryRelationship==='discover'));
            if(v.advisorPosition&&['x','y'].every(function(key){return Number.isFinite(v.advisorPosition[key])&&v.advisorPosition[key]>=0&&v.advisorPosition[key]<=1;}))s.advisorPosition=v.advisorPosition;
          }
          render();
        }};
        controllers.push(controller);render();
        if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:app,onChange:function(){app.style.setProperty('--jp-radius',s.appearance.radius+'px');app.classList.toggle('jp-compact',s.appearance.density==='Compact');}});tweak.addSlider(s.appearance,'radius',{label:'Corner radius',min:4,max:24,unit:'px'});tweak.addSelect(s.appearance,'density',{label:'Content spacing',options:['Comfortable','Compact']});}
      }
      mount('jp-workspace',false);mount('jp-guided',true);
      window.addEventListener('openai:set_globals',function(e){const ws=e.detail&&e.detail.globals&&e.detail.globals.widgetState;const p=ws&&ws.privateContent;if(p)controllers.forEach(function(c){c.restore(p[c.id]);});});
    })();
  </script>
