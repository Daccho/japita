      #japita-lookbook .jp-facts,#japita-lookbook .jp-field-grid { grid-template-columns:1fr; }
      #japita-lookbook .jp-profile-tabs { gap:4px 14px; }
      #japita-lookbook .jp-profile-tabs button { font-size:12px; }
      #japita-lookbook .jp-link-row { grid-template-columns:20px minmax(0,1fr); gap:10px; }
      #japita-lookbook .jp-link-row&gt;.jp-action { grid-column:2; justify-self:start; }
      #japita-lookbook .jp-sheet-head { padding:15px; flex-wrap:wrap; }
      #japita-lookbook .jp-sheet-actions { margin-left:auto; }
      #japita-lookbook .jp-sheet-foot { padding:12px 15px; }
      #japita-lookbook .jp-supplier-summary { grid-template-columns:52px minmax(0,1fr) auto; gap:12px; }
      #japita-lookbook .jp-supplier-thumb { width:52px; height:52px; }
      #japita-lookbook .jp-supplier-product { grid-column:2; }
      #japita-lookbook .jp-supplier-price { grid-column:2; text-align:left; }
      #japita-lookbook .jp-supplier-price small { max-width:none; }
      #japita-lookbook .jp-supplier-summary&gt;.jp-action { grid-column:3; grid-row:1 / span 3; }
      #japita-lookbook .jp-match-reason { margin-left:64px!important; }
      #japita-lookbook .jp-body,#japita-lookbook .jp-guide-shell { padding-bottom:90px; }
    }
    @media(max-width:480px) {
      #japita-lookbook .jp-brand-divider { display:none; }
      #japita-lookbook .jp-restaurant-logo { width:64px; height:64px; }
      #japita-lookbook .jp-restaurant-name { font-size:14px; }
      #japita-lookbook .jp-brand-logo { width:40px; height:40px; }
      #japita-lookbook .jp-offer-identity { grid-template-columns:88px minmax(0,1fr); gap:12px; align-items:start; }
      #japita-lookbook .jp-offer-photo img { height:88px; }
      #japita-lookbook .jp-directory-filters { grid-template-columns:1fr; gap:10px; }
      #japita-lookbook .jp-supplier-summary { grid-template-columns:48px minmax(0,1fr); }
      #japita-lookbook .jp-supplier-thumb { width:48px; height:48px; }
      #japita-lookbook .jp-supplier-summary&gt;.jp-action { grid-column:2; grid-row:auto; justify-self:start; }
      #japita-lookbook .jp-match-reason { margin-left:60px!important; }
      #japita-lookbook .jp-menu-document { padding:30px 20px 23px; }
      #japita-lookbook .jp-menu-document .jp-menu-restaurant { font-size:24px; }
      #japita-lookbook .jp-menu-document .jp-menu-dish-line h3 { font-size:17px; }
      #japita-lookbook .jp-menu-masthead { padding-top:15px; }
    }
    @media(pointer:coarse) { #japita-lookbook button,#japita-lookbook summary { min-height:44px; } #japita-lookbook input,#japita-lookbook select,#japita-lookbook textarea { font-size:16px; } }
