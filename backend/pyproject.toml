[project]
name = "japita"
version = "0.1.0"
description = "Restaurant purchasing advisor: one main agent on Gemma (vLLM on AMD) with explicit tools"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["japita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
