[project]
name = "japita"
version = "0.1.0"
description = "Restaurant purchasing advisor: one main agent on Gemma (vLLM on AMD) with explicit tools"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.3",
    "openai>=1.40",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["japita"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: calls the real model endpoint (uv run pytest -m live -s)"]
