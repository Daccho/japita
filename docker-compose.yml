services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: japita
      POSTGRES_PASSWORD: japita
      POSTGRES_DB: japita
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U japita"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
